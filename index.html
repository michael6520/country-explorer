<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts/index.js"></script>
</head>
<body>

    <div class="page">
        <header class="toolbar">
            <h1 class="toolbar__title">Countries explorer</h1>

            <div class="toolbar__search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" placeholder="Search...">
            </div>

            <button class="saved-btn" type="button">Saved</button>

            <div class="toolbar__controls">
                <button class="dropdown-btn" type="button">
                    Region
                    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <ul class="dropdown-menu" hidden></ul>
            </div>
        </header>

        <main class="country-grid"></main>

        <footer class="footer-actions">
            <button class="surprise-btn" type="button">
                <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <circle cx="15.5" cy="15.5" r="1.5"></circle>
                </svg>
                Surprise me
            </button>
            
            <button class="reload-btn" type="button">
                <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Reload
            </button>
        </footer>
    </div>
</body>
</html>
